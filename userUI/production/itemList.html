<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>리스트 페이지</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/commen.css">
    <link rel="stylesheet" href="../css/production/itemList.css">
</head>
<body>
    <div class="container">
        <header class="main-banner">
            <img src="../img/maincandidate.jpg" alt="Main Banner Image">
        </header>

        <div class="filter-bar">
            <div class="item-count">
                <span id="total-items">0 Item</span>
            </div>
            <div class="sort-container">
                <button class="sort-button">
                    <span id="sort-text">정렬 기준</span>
                    <span class="arrow">▼</span>
                </button>
                <div class="sort-dropdown">
                    <a href="#" data-sort="popular">인기순</a>
                    <a href="#" data-sort="price_desc">높은가격순</a>
                    <a href="#" data-sort="price_asc">낮은가격순</a>
                </div>
            </div>
        </div>
        
        <main id="product-grid" class="product-grid"></main>

        <nav class="pagination-container">
            <ul id="pagination" class="pagination"></ul>
        </nav>
    </div>
    <script src="../js/production/itemLIst.js"></script>
</body>
