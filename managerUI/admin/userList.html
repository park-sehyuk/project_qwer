<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>회원관리</title>
    <link rel="stylesheet" href="../adminCss/userList.css">
</head>

<body>
    <div id="scale">
        <div class="left-side">

            <a href="/managerUI/admin/userList.html" class="text-border">
                <button class="userList">
                    <div class="userimg"><img src="../img/user-color.png" alt=""></div>
                    <div>회원관리</div>
                </button>
            </a>

            <a href="/managerUI/admin/post.html" class="text-border">
                <button class="postList">
                    <div class="userimg2"><img src="../img/menu-bar.png" alt=""></div>
                    <div>게시물 관리</div>
                </button>
            </a>

            <a href="/managerUI/admin/category.html" class="text-border">
                <button class="categoryList">
                    <div class="userimg3"><img src="../img/blogging.png" alt=""></div>
                    <div>카테고리 리스트</div>
                </button>
            </a>
        </div>
        <div class="top-right">
            <div class="right-side">
                <div class="right-Title">
                    <p class="right-Title1">회원관리</p>
                    <p class="right-Title2">구매하신 회원분들의 내역조회 확인입니다.</p>
                </div>
                <div class="payment">

                    <p class="payment-text">결제 일시</p>
                    <div class="payment-cal">
                        <input type="date" id="startDate" value="2025-05-25">
                      <input type="date" id="endDate" value="2025-07-06">
                       
                    </div>
                </div>
                <div class="button-tap">
                    <div class="startsearch">
                        <button class="starline">초기화</button>
                        <button class="search">검색</button>
                    </div>
                    <button class="download">엑셀 다운로드</button>
                </div>
            </div>


            <table class="user-data-table">
                <thead>
                    <tr>
                        <th>아이디</th>
                        <th>이름</th>
                        <th>주소</th>
                        <th>전화번호</th>
                        <th>금액</th>
                        <th>상품명</th>
                        <th>구매일시</th>
                        <th>결제수단</th>
                        <th>세금 계산서</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
    <script src="userList.js"></script>
</body>

</html>
